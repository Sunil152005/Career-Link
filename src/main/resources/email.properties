# =====================================================================
# CareerLink - Email & SMTP Security Configuration
# =====================================================================
# To send real verification OTPs and alerts directly to user Gmail/Email inboxes,
# enter your Gmail / SMTP credentials below.
#
# FOR GMAIL:
# 1. Enable 2-Step Verification in your Google Account (https://myaccount.google.com/security)
# 2. Generate an "App Password" (16 characters) under Security -> 2-Step Verification -> App Passwords
# 3. Enter your Gmail address in mail.smtp.user and the 16-character App Password in mail.smtp.password
#
# (Leave empty to use local secure console simulator mode during development)
# =====================================================================

mail.smtp.host=smtp.gmail.com
mail.smtp.port=587
mail.smtp.auth=true
mail.smtp.starttls.enable=true
mail.smtp.ssl.protocols=TLSv1.2 TLSv1.3
mail.smtp.sender_name=CareerLink Security

# Enter your Gmail / SMTP credentials below:
mail.smtp.user=
mail.smtp.password=
